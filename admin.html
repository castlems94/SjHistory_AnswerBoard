<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>역사 놀토 - 관리자 사령탑</title>
<style>
  @font-face {
    font-family: 'GangwonEduModu';
    font-weight: 700;
    font-style: normal;
    font-display: swap;
    src: url('https://cdn.jsdelivr.net/gh/fonts-archive/GangwonEduModu/GangwonEduModu-Bold.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/gh/fonts-archive/GangwonEduModu/GangwonEduModu-Bold.woff') format('woff'),
         url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEdu_OTFBoldA.woff') format('woff');
  }
  :root {
    --board-green-1: #1f4d3a;
    --board-green-2: #163a2c;
    --chalk-white: #f4f2e9;
    --chalk-yellow: #f4e3a1;
    --wood-dark: #6b4423;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'GangwonEduModu', sans-serif;
    font-weight: 700;
    background: #10161a;
    color: #e5e7eb;
    padding: 24px;
    margin: 0;
  }
  h2 {
    font-family: 'GangwonEduModu', cursive;
    font-weight: 700;
    font-size: 34px;
    color: var(--chalk-yellow);
    margin: 0 0 18px;
  }
  .banner {
    background: linear-gradient(160deg, var(--board-green-1), var(--board-green-2));
    border: 6px solid var(--wood-dark);
    border-radius: 10px;
    padding: 16px 22px;
    margin-bottom: 22px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.4);
  }
  .banner h2 { margin: 0; }
  .banner p { margin: 4px 0 0; color: rgba(244,242,233,0.7); font-size: 14px; }

  .control-panel {
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  button {
    padding: 10px 20px;
    font-family: 'GangwonEduModu', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    color: white;
    transition: filter 0.15s;
  }
  button:hover { filter: brightness(1.1); }
  input {
    padding: 10px;
    font-size: 15px;
    border: 1px solid #334155;
    border-radius: 6px;
    background: #0f172a;
    color: white;
  }
  .board {
    background: #0f172a;
    padding: 20px;
    border-radius: 10px;
    min-height: 200px;
  }
  .board h3 { display: flex; justify-content: space-between; align-items: center; font-weight: normal; }
  #submit-count { font-size: 14px; color: #94a3b8; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    margin-bottom: 8px;
    font-size: 17px;
    padding: 8px 12px;
    background: #1e293b;
    border-radius: 6px;
  }
</style>
</head>
<body>
  <div class="banner">
    <h2>🛠 역사 놀토 사령탑</h2>
    <p>정답을 입력하고 라운드를 시작하면 학생 화면에 빈칸이 표시됩니다.</p>
  </div>

  <div class="control-panel">
    <input type="text" id="admin-answer" placeholder="정답 입력 (예: 조선왕조실록)">
    <input type="number" id="time-limit" value="60" style="width: 80px;" title="제한시간(초)">

    <button onclick="startRound()" style="background:#22c55e;">▶ 라운드 시작</button>
    <button onclick="endRound()" style="background:#ef4444;">■ 강제 종료</button>
    <button onclick="checkAnswers()" style="background:#3b82f6;">✔ 오답률 확인</button>
    <button onclick="publishFinalRanking()" style="background:#a855f7;">🏆 명예의 전당 발표</button>
  </div>

  <div class="board">
    <h3>📊 실시간 학생 제출 현황 <span id="submit-count"></span></h3>
    <ul id="student-status"></ul>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBakDXeQGKrR3SdK-rXIOkMs_gl70uKmm4",
      authDomain: "historyboard-def24.firebaseapp.com",
      databaseURL: "https://historyboard-def24-default-rtdb.firebaseio.com",
      projectId: "historyboard-def24",
      storageBucket: "historyboard-def24.firebasestorage.app",
      messagingSenderId: "790990066402",
      appId: "1:790990066402:web:643ea7e8b9061fc79644bb",
      measurementId: "G-1382K6SR75"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentAnswer = "";
    let studentData = {};

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // 1. 라운드 시작 (이전 제출기록을 먼저 비우고 새 라운드 세팅)
    window.startRound = function () {
      currentAnswer = document.getElementById('admin-answer').value;
      const timeLimit = parseInt(document.getElementById('time-limit').value);
      if (!currentAnswer) { alert("정답을 입력하세요."); return; }
      if (!timeLimit || timeLimit <= 0) { alert("제한시간을 올바르게 입력하세요."); return; }

      // 이전 라운드 제출기록 초기화 -> 학생 목록에 이전 답이 남지 않도록
      set(ref(db, 'submissions'), null).then(() => {
        set(ref(db, 'quizState'), {
          isRoundActive: true,
          answerLength: currentAnswer.length,
          endTime: Date.now() + (timeLimit * 1000),
          finalRanking: null
        });
      });
      alert("라운드 시작! 학생들 화면에 빈칸이 열렸습니다.");
    };

    // 2. 강제 종료
    window.endRound = function () {
      update(ref(db, 'quizState'), { isRoundActive: false });
      alert("학생 화면 입력이 차단되었습니다.");
    };

    // 실시간 제출 현황판 수신
    onValue(ref(db, 'submissions'), (snapshot) => {
      studentData = snapshot.val() || {};
      let html = '';
      for (let id in studentData) {
        html += `<li>${escapeHtml(id)} : ${escapeHtml(studentData[id].answer)} (제출완료)</li>`;
      }
      document.getElementById('student-status').innerHTML = html;
      document.getElementById('submit-count').innerText = `(제출 ${Object.keys(studentData).length}명)`;
    });

    // 레벤슈타인 거리 알고리즘 (오류 개수 계산)
    function getErrorCount(correct, submitted) {
      const matrix = [];
      for (let i = 0; i <= submitted.length; i++) matrix[i] = [i];
      for (let j = 0; j <= correct.length; j++) matrix[0][j] = j;
      for (let i = 1; i <= submitted.length; i++) {
        for (let j = 1; j <= correct.length; j++) {
          if (submitted.charAt(i - 1) === correct.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
          }
        }
      }
      return matrix[submitted.length][correct.length];
    }

    // 3. 채점 확인
    window.checkAnswers = function () {
      if (!currentAnswer) { alert("먼저 라운드를 시작해서 정답을 등록하세요."); return; }
      let html = '';
      for (let id in studentData) {
        let errors = getErrorCount(currentAnswer, studentData[id].answer);
        update(ref(db, `submissions/${id}`), { totalErrors: errors });

        let resultTxt = errors === 0
          ? "<span style='color:#4ade80;'>정답!</span>"
          : `<span style='color:#f87171;'>${errors}글자 오류</span>`;
        html += `<li>${escapeHtml(id)} : ${escapeHtml(studentData[id].answer)} → ${resultTxt}</li>`;
      }
      document.getElementById('student-status').innerHTML = html;
    };

    // 4. 최종 명예의 전당 발표
    window.publishFinalRanking = function () {
      let arr = [];
      for (let id in studentData) {
        arr.push({
          id: id,
          totalErrors: studentData[id].totalErrors ?? 0,
          timestamp: studentData[id].timestamp || 0
        });
      }
      arr.sort((a, b) => a.totalErrors === b.totalErrors ? a.timestamp - b.timestamp : a.totalErrors - b.totalErrors);
      update(ref(db, 'quizState'), { finalRanking: arr.slice(0, 10), isRoundActive: false });
    };
  </script>
</body>
</html>
