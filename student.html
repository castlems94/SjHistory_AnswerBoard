<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>역사 놀토 - 정답판</title>
<style>
  @font-face {
    font-family: 'GangwonEduModu';
    font-weight: 700;
    font-style: normal;
    font-display: swap;
    src: url('https://cdn.jsdelivr.net/gh/fonts-archive/GangwonEduModu/GangwonEduModu-Bold.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/gh/fonts-archive/GangwonEduModu/GangwonEduModu-Bold.woff') format('woff'),
         url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEdu_OTFBoldA.woff') format('woff');
  }
  :root {
    --board-green-1: #1f4d3a;
    --board-green-2: #163a2c;
    --chalk-white: #f4f2e9;
    --chalk-yellow: #f4e3a1;
    --chalk-red: #e8a1a1;
    --wood-light: #a9713f;
    --wood-dark: #6b4423;
    --box-w: clamp(44px, 7vw, 92px);
    --box-h: clamp(54px, 8.5vw, 112px);
    --box-font: clamp(22px, 4.5vw, 48px);
    --box-gap: clamp(8px, 1.5vw, 16px);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'GangwonEduModu', sans-serif;
    font-weight: 700;
    background: #0c0c0c;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(255,255,255,0.03), transparent 40%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5vh 1.5vw;
    overflow: auto;
  }

  /* 나무 액자 */
  .frame {
    background: linear-gradient(160deg, var(--wood-light), var(--wood-dark) 60%, #4e2f16);
    padding: clamp(10px, 1.5vw, 24px);
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 0 3px rgba(0,0,0,0.25);
    position: relative;
    width: 100%;
    max-width: 1400px;
    height: 96vh;
    max-height: 980px;
  }
  .screw {
    position: absolute; width: 12px; height: 12px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #e8d3ab, #5c3c1f 70%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .screw.tl { top: 10px; left: 10px; }
  .screw.tr { top: 10px; right: 10px; }
  .screw.bl { bottom: 10px; left: 10px; }
  .screw.br { bottom: 10px; right: 10px; }

  /* 칠판 본체 */
  .container {
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.05), transparent 55%),
      radial-gradient(ellipse at 70% 80%, rgba(255,255,255,0.04), transparent 55%),
      linear-gradient(160deg, var(--board-green-1), var(--board-green-2));
    border-radius: 8px;
    padding: clamp(16px, 3vh, 48px) clamp(14px, 3vw, 40px);
    text-align: center;
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.45);
    overflow: auto;
  }

  .chalk-title {
    font-family: 'GangwonEduModu', sans-serif;
    font-weight: 700;
    font-size: clamp(26px, 5vw, 60px);
    color: var(--chalk-white);
    text-shadow: 0 0 6px rgba(244,242,233,0.35);
    margin: 0 0 6px;
    letter-spacing: 1px;
  }

  #student-info {
    font-size: clamp(15px, 2.2vw, 26px);
    color: var(--chalk-yellow);
    text-shadow: 0 0 5px rgba(244,227,161,0.4);
    margin: 0 0 clamp(8px, 2vh, 20px);
    font-weight: 700;
  }

  .timer-box {
    font-size: clamp(17px, 3vw, 32px);
    font-weight: 700;
    color: var(--chalk-red);
    text-shadow: 0 0 6px rgba(232,161,161,0.4);
    margin-bottom: clamp(14px, 3vh, 30px);
    min-height: 1.2em;
  }

  .boxes-container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: var(--box-gap);
    margin-bottom: clamp(18px, 3.5vh, 36px);
    cursor: text;
  }

  .answer-box {
    width: var(--box-w);
    height: var(--box-h);
    border: 3px dashed rgba(244,242,233,0.55);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--box-font);
    font-weight: 700;
    color: var(--chalk-white);
    text-shadow: 0 0 5px rgba(244,242,233,0.5);
    transition: border-color 0.2s, background-color 0.2s;
    flex-shrink: 0;
  }
  .answer-box.active {
    border-style: solid;
    border-color: var(--chalk-yellow);
    background-color: rgba(244,227,161,0.08);
    animation: blink-cursor 1s infinite;
  }
  .answer-box.correct {
    border-style: solid;
    border-color: #4ade80;
    background-color: rgba(74,222,128,0.15);
    color: #4ade80;
    text-shadow: 0 0 8px rgba(74,222,128,0.6);
  }
  .answer-box.wrong {
    border-style: solid;
    border-color: #f87171;
    background-color: rgba(248,113,113,0.15);
    color: #f87171;
    text-shadow: 0 0 8px rgba(248,113,113,0.6);
  }
  @keyframes blink-cursor {
    0%, 100% { box-shadow: 0 0 0 rgba(244,227,161,0); }
    50% { box-shadow: 0 0 12px rgba(244,227,161,0.5); }
  }

  #hidden-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: transparent;
    caret-color: transparent;
    font-size: 16px;
    padding: 0;
    margin: 0;
  }
  #hidden-input:disabled { cursor: not-allowed; }

  button {
    padding: clamp(10px, 1.8vh, 16px) clamp(20px, 3vw, 38px);
    font-family: 'GangwonEduModu', sans-serif;
    font-weight: 700;
    font-size: clamp(15px, 2vw, 20px);
    border-radius: 10px;
    border: 2px dashed var(--chalk-white);
    cursor: pointer;
    color: var(--chalk-white);
    background-color: transparent;
    transition: background-color 0.2s, transform 0.1s;
  }
  button:hover { background-color: rgba(244,242,233,0.12); }
  button:active { transform: scale(0.97); }

  #submit-status {
    font-size: clamp(12px, 1.6vw, 15px);
    color: rgba(244,242,233,0.65);
    margin-top: clamp(10px, 1.8vh, 16px);
    min-height: 1.4em;
  }

  .creator-credit {
    position: absolute;
    bottom: 10px;
    right: 18px;
    font-family: 'GangwonEduModu', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: rgba(244,242,233,0.4);
  }

  /* 결과 화면 공통 (라운드 결과 / 최종 결과) */
  .fullscreen-overlay {
    display: none;
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(5,10,8,0.96);
    color: var(--chalk-white);
    align-items: center; justify-content: center; flex-direction: column;
    z-index: 1000;
    font-family: 'GangwonEduModu', sans-serif;
    font-weight: 700;
    padding: 20px;
    text-align: center;
  }
  .fullscreen-overlay h1 {
    font-family: 'GangwonEduModu', sans-serif;
    font-weight: 700;
    color: var(--chalk-yellow);
    text-shadow: 0 0 14px rgba(244,227,161,0.5);
    font-size: clamp(28px, 5vw, 52px);
    margin-bottom: 20px;
  }
  .result-list { max-height: 70vh; overflow-y: auto; width: 100%; max-width: 720px; }
  .rank-item {
    font-size: clamp(16px, 2.6vw, 26px);
    margin: 8px 0;
    padding: 8px 16px;
    background: rgba(244,242,233,0.06);
    border-radius: 8px;
  }
  .waiting-note {
    margin-top: 24px;
    font-size: clamp(13px, 1.8vw, 17px);
    color: rgba(244,242,233,0.55);
    font-weight: 400;
  }

  /* 입장 화면 */
  #name-entry-screen { z-index: 2000; }
  #name-input {
    width: min(90vw, 420px);
    padding: 16px 18px;
    font-size: clamp(16px, 2.4vw, 22px);
    font-family: 'GangwonEduModu', sans-serif;
    font-weight: 700;
    text-align: center;
    border: 3px dashed rgba(244,242,233,0.6);
    border-radius: 10px;
    background: rgba(244,242,233,0.06);
    color: var(--chalk-white);
    outline: none;
    margin-bottom: 20px;
  }
  #name-input::placeholder { color: rgba(244,242,233,0.4); }
  #name-input:focus { border-style: solid; border-color: var(--chalk-yellow); }

  @media (max-width: 480px) {
    .frame { height: auto; max-height: none; }
    .container { min-height: 70vh; }
  }
</style>
</head>
<body>
  <div class="frame">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>
    <div class="container" id="main-container" onclick="focusInput()">
      <h1 class="chalk-title">역사 놀토</h1>
      <h3 id="student-info"></h3>
      <div class="timer-box" id="timer">선생님의 시작을 기다리는 중...</div>

      <div class="boxes-wrapper" style="position: relative; display: inline-block;">
        <div class="boxes-container" id="boxes-container"></div>
        <input type="text" id="hidden-input" autocomplete="off" disabled>
      </div>

      <button id="submit-btn" onclick="submitAnswer(event)" style="display:none;">정답 제출</button>
      <button id="edit-btn" onclick="enableEdit(event)" style="display:none;">✏ 수정하기</button>
      <div id="submit-status"></div>

      <div class="creator-credit">Created by 조성주 T</div>
    </div>
  </div>

  <div id="round-result-overlay" class="fullscreen-overlay">
    <h1 id="round-result-title">🥇 1라운드 결과 🥇</h1>
    <div class="result-list" id="round-result-list"></div>
    <p class="waiting-note">다음 라운드를 준비해주세요...</p>
  </div>

  <div id="final-result-overlay" class="fullscreen-overlay">
    <h1>🏆 최종 결과 🏆</h1>
    <div class="result-list" id="final-result-list"></div>
  </div>

  <div id="name-entry-screen" class="fullscreen-overlay" style="display:flex;">
    <h1>성주쌤의 놀라운 평일</h1>
    <input type="text" id="name-input" placeholder="학번과 이름을 입력하세요 (예: 7반 13번 홍길동)">
    <button onclick="enterRoom()">입장하기</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBakDXeQGKrR3SdK-rXIOkMs_gl70uKmm4",
      authDomain: "historyboard-def24.firebaseapp.com",
      databaseURL: "https://historyboard-def24-default-rtdb.firebaseio.com",
      projectId: "historyboard-def24",
      storageBucket: "historyboard-def24.firebasestorage.app",
      messagingSenderId: "790990066402",
      appId: "1:790990066402:web:643ea7e8b9061fc79644bb",
      measurementId: "G-1382K6SR75"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function sanitizeKey(str) {
      return str.replace(/[.#$\[\]/]/g, '_').trim().slice(0, 60);
    }
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    let studentId = null;

    window.enterRoom = function () {
      const val = document.getElementById('name-input').value.trim();
      studentId = val ? sanitizeKey(val) : ("익명학생_" + Math.floor(Math.random() * 1000));
      document.getElementById('student-info').innerText = studentId;
      document.getElementById('name-entry-screen').style.display = 'none';
      document.getElementById('hidden-input').focus();
    };
    document.getElementById('name-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') window.enterRoom();
    });

    let localTimerInterval;
    let currentAnswerLength = 0;
    let currentRoundNum = 1;
    let lastRoundKey = null;
    let hasSubmittedThisRound = false;
    let latestResults = {};

    window.focusInput = function () {
      const input = document.getElementById('hidden-input');
      if (!input.disabled) input.focus();
    };

    // ---------- 결과 데이터 ----------
    onValue(ref(db, 'results'), (snap) => {
      latestResults = snap.val() || {};
      renderRound1Overlay();
      renderFinalOverlay();
    });

    function renderRound1Overlay() {
      const r1 = latestResults.round1;
      const list = document.getElementById('round-result-list');
      if (!r1) { list.innerHTML = ''; return; }
      let html = '';
      r1.ranking.forEach((item, idx) => {
        html += `<div class="rank-item">${idx + 1}등. ${escapeHtml(item.id)} — 맞은 글자 ${item.correct}/${r1.answerLength}</div>`;
      });
      list.innerHTML = html || '<div class="rank-item">제출한 학생이 없습니다.</div>';
    }

    function renderFinalOverlay() {
      const fin = latestResults.final;
      const list = document.getElementById('final-result-list');
      if (!fin) { list.innerHTML = ''; return; }
      let html = '';
      fin.ranking.forEach((item, idx) => {
        html += `<div class="rank-item">${idx + 1}등. ${escapeHtml(item.id)} — 총 맞은 글자 ${item.totalCorrect}개</div>`;
      });
      list.innerHTML = html || '<div class="rank-item">제출한 학생이 없습니다.</div>';
    }

    function showOverlay(id) {
      document.getElementById(id).style.display = 'flex';
    }
    function hideOverlay(id) {
      document.getElementById(id).style.display = 'none';
    }

    // ---------- 라운드 종료 시: 학생 본인 답안을 칸별로 O/X 채점하는 애니메이션 ----------
    let hasCheckedRound1 = false;
    let hasCheckedRound2 = false;

    async function runRoundCheck(roundNum) {
      try {
        const [subSnap, detailSnap, lenSnap] = await Promise.all([
          get(ref(db, `submissions/round${roundNum}/${studentId}`)),
          get(ref(db, `results/round${roundNum}/detail/${studentId}`)),
          get(ref(db, `results/round${roundNum}/answerLength`)),
        ]);

        if (!detailSnap.exists()) return; // 제출을 안 한 학생은 채점 애니메이션 생략

        const submittedText = subSnap.exists() ? (subSnap.val().answer || '') : '';
        const marks = detailSnap.val();
        const totalLen = lenSnap.exists() ? lenSnap.val() : marks.length;

        clearInterval(localTimerInterval);
        document.getElementById('submit-btn').style.display = 'none';
        document.getElementById('edit-btn').style.display = 'none';
        document.getElementById('submit-status').innerText = '';

        // 제출했던 답안 그대로 박스에 다시 표시한 뒤 채점 시작
        const container = document.getElementById('boxes-container');
        container.innerHTML = '';
        for (let i = 0; i < totalLen; i++) {
          container.innerHTML += `<div class="answer-box" id="box-${i}">${escapeHtml(submittedText[i] || '')}</div>`;
        }
        sizeBoxes(totalLen);

        document.getElementById('timer').innerText = `${roundNum}라운드 채점 중...`;

        let correctCount = 0;
        for (let i = 0; i < totalLen; i++) {
          await new Promise((resolve) => setTimeout(resolve, 350));
          const box = document.getElementById(`box-${i}`);
          if (!box) continue;
          if (marks[i]) {
            box.classList.add('correct');
            box.innerText = 'O';
            correctCount++;
          } else {
            box.classList.add('wrong');
            box.innerText = 'X';
          }
          document.getElementById('timer').innerText = `채점 중... (${correctCount}개 맞음)`;
        }
        document.getElementById('timer').innerText = `✅ 맞은 개수: ${correctCount} / ${totalLen}`;
      } catch (err) {
        console.error('채점 애니메이션 오류:', err);
      }
    }

    // ---------- 퀴즈 상태 ----------
    onValue(ref(db, 'quizState'), (snapshot) => {
      const state = snapshot.val();
      if (!state) {
        hideOverlay('round-result-overlay');
        hideOverlay('final-result-overlay');
        clearInterval(localTimerInterval);
        document.getElementById('boxes-container').innerHTML = '';
        document.getElementById('timer').innerText = '선생님의 시작을 기다리는 중...';
        const hi = document.getElementById('hidden-input');
        hi.disabled = true;
        hi.value = '';
        document.getElementById('submit-btn').style.display = 'none';
        document.getElementById('edit-btn').style.display = 'none';
        document.getElementById('submit-status').innerText = '';
        currentAnswerLength = 0;
        lastRoundKey = null;
        hasCheckedRound1 = false;
        hasCheckedRound2 = false;
        return;
      }

      // 최종 결과 화면 (최우선)
      if (state.finalDone) {
        hideOverlay('round-result-overlay');
        clearInterval(localTimerInterval);
        if (!hasCheckedRound2) {
          hasCheckedRound2 = true;
          runRoundCheck(2).then(() => {
            setTimeout(() => showOverlay('final-result-overlay'), 1500);
          });
        } else {
          showOverlay('final-result-overlay');
        }
        return;
      } else {
        hideOverlay('final-result-overlay');
      }

      // 1라운드 결과 화면 (1라운드가 끝나고, 아직 2라운드가 시작 전일 때)
      if (state.round1Done && state.currentRound === 1 && !state.isRoundActive) {
        document.getElementById('round-result-title').innerText = '🥇 1라운드 결과 🥇';
        clearInterval(localTimerInterval);
        if (!hasCheckedRound1) {
          hasCheckedRound1 = true;
          runRoundCheck(1).then(() => {
            setTimeout(() => showOverlay('round-result-overlay'), 1500);
          });
        } else {
          showOverlay('round-result-overlay');
        }
        return;
      } else {
        hideOverlay('round-result-overlay');
      }

      // 평상시 문제 풀이 화면
      currentRoundNum = state.currentRound || 1;

      const roundKey = state.endTime || null;
      const isNewRound = roundKey !== lastRoundKey;

      if (state.answerLength && (isNewRound || currentAnswerLength !== state.answerLength)) {
        currentAnswerLength = state.answerLength;
        const container = document.getElementById('boxes-container');
        container.innerHTML = '';
        for (let i = 0; i < currentAnswerLength; i++) {
          container.innerHTML += `<div class="answer-box" id="box-${i}"></div>`;
        }
        sizeBoxes(currentAnswerLength);
        document.getElementById('hidden-input').value = '';
        document.getElementById('submit-status').innerText = '';
        document.getElementById('edit-btn').style.display = 'none';
        hasSubmittedThisRound = false;
      }

      if (isNewRound) {
        lastRoundKey = roundKey;
        hasCheckedRound1 = false;
        hasCheckedRound2 = false;
      }

      const hiddenInput = document.getElementById('hidden-input');
      const submitBtn = document.getElementById('submit-btn');
      const editBtn = document.getElementById('edit-btn');

      if (state.isRoundActive) {
        // 이미 이번 라운드에 제출을 완료한 상태라면(제출 후 새로고침 등) 잠금 상태를 유지
        if (hasSubmittedThisRound) {
          hiddenInput.disabled = true;
          submitBtn.style.display = 'none';
          editBtn.style.display = 'inline-block';
        } else {
          hiddenInput.disabled = false;
          submitBtn.style.display = 'inline-block';
          editBtn.style.display = 'none';
        }

        clearInterval(localTimerInterval);
        localTimerInterval = setInterval(() => {
          const timeLeft = Math.max(0, Math.floor((state.endTime - Date.now()) / 1000));
          document.getElementById('timer').innerText = `${currentRoundNum}라운드 - 남은 시간: ${timeLeft}초`;
          if (timeLeft <= 0) {
            clearInterval(localTimerInterval);
            hiddenInput.disabled = true;
            submitBtn.style.display = 'none';
            editBtn.style.display = 'none';
          }
        }, 100);
      } else {
        clearInterval(localTimerInterval);
        hiddenInput.disabled = true;
        submitBtn.style.display = 'none';
        editBtn.style.display = 'none';
        document.getElementById('timer').innerText = "선생님의 시작을 기다리는 중...";
      }
    });

    // 입력 박스 크기: 화면에 스크롤 없이 들어가는 범위 안에서 "가장 큰 크기"를 이분 탐색으로 정확히 찾음
    function sizeBoxes(length) {
      if (!length) return;
      const mainEl = document.getElementById('main-container');
      const root = document.documentElement.style;

      function apply(boxW) {
        const boxH = boxW * 1.25;
        const gap = Math.max(4, boxH * 0.05);
        root.setProperty('--box-w', boxW + 'px');
        root.setProperty('--box-h', boxH + 'px');
        root.setProperty('--box-font', (boxW * 0.6) + 'px');
        root.setProperty('--box-gap', gap + 'px');
      }
      function fits() {
        return mainEl.scrollHeight <= mainEl.clientHeight + 1;
      }

      const MIN_W = 24, MAX_W = 140;
      apply(MAX_W);
      if (fits()) return; // 최대 크기로도 충분히 들어가면 그대로 사용

      apply(MIN_W);
      if (!fits()) return; // 최소 크기로도 안 들어가면 최소 크기 유지 (필요 시 스크롤 허용)

      let lo = MIN_W, hi = MAX_W;
      for (let i = 0; i < 14; i++) {
        const mid = (lo + hi) / 2;
        apply(mid);
        if (fits()) lo = mid; else hi = mid;
      }
      apply(lo);
    }
    window.addEventListener('resize', () => {
      if (currentAnswerLength) sizeBoxes(currentAnswerLength);
    });

    // 조합 중(한글 입력기 사용 중)에는 값을 건드리지 않아야 한글 조합이 깨지지 않음
    let isComposing = false;
    const hiddenInputEl = document.getElementById('hidden-input');

    function renderBoxesFromText(text) {
      const shown = text.slice(0, currentAnswerLength);
      for (let i = 0; i < currentAnswerLength; i++) {
        const box = document.getElementById(`box-${i}`);
        if (box) {
          box.innerText = shown[i] || '';
          if (i === shown.length) box.classList.add('active');
          else box.classList.remove('active');
        }
      }
    }

    function processTyping(target) {
      let text = target.value.replace(/[^0-9a-zA-Z ㄱ-ㅎㅏ-ㅣ가-힣]/g, '');
      if (text.length > currentAnswerLength) text = text.substring(0, currentAnswerLength);
      target.value = text;
      renderBoxesFromText(text);
      if (hasSubmittedThisRound) {
        document.getElementById('submit-status').innerText = '내용이 수정되었습니다. 다시 "정답 제출"을 눌러주세요.';
      }
    }

    hiddenInputEl.addEventListener('compositionstart', () => { isComposing = true; });
    hiddenInputEl.addEventListener('compositionend', (e) => {
      isComposing = false;
      processTyping(e.target);
    });
    hiddenInputEl.addEventListener('input', (e) => {
      if (isComposing) {
        // 한글 조합 중: 값은 건드리지 않고 화면 표시만 실시간으로 갱신 (조합 깨짐 방지)
        renderBoxesFromText(e.target.value);
        return;
      }
      processTyping(e.target);
    });

    window.submitAnswer = function (e) {
      if (e) e.stopPropagation();
      if (!studentId) {
        alert("먼저 이름을 입력하고 입장해주세요!");
        document.getElementById('name-entry-screen').style.display = 'flex';
        return;
      }
      const text = document.getElementById('hidden-input').value;
      set(ref(db, `submissions/round${currentRoundNum}/` + studentId), { answer: text, timestamp: Date.now() });
      hasSubmittedThisRound = true;

      const hi = document.getElementById('hidden-input');
      hi.disabled = true;
      document.getElementById('submit-btn').style.display = 'none';
      document.getElementById('edit-btn').style.display = 'inline-block';
      document.getElementById('submit-status').innerText = '✔ 제출 완료! (수정하려면 "수정하기"를 눌러주세요)';
    };

    window.enableEdit = function (e) {
      if (e) e.stopPropagation();
      const hi = document.getElementById('hidden-input');
      hi.disabled = false;
      hi.focus();
      document.getElementById('edit-btn').style.display = 'none';
      document.getElementById('submit-btn').style.display = 'inline-block';
      document.getElementById('submit-status').innerText = '수정 중입니다. 다 고치면 "정답 제출"을 다시 눌러주세요.';
    };
  </script>
</body>
</html>
